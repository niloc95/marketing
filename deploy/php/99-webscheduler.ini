; =============================================================================
; PHP settings for the WebScheduler stack.
;
; Install to BOTH SAPIs — they read separate ini trees and the CLI one is what
; `php spark migrate` and the nightly cron use:
;   /etc/php/8.3/fpm/conf.d/99-webscheduler.ini
;   /etc/php/8.3/cli/conf.d/99-webscheduler.ini
; Then: systemctl restart php8.3-fpm
;
; A drop-in rather than edits to php.ini, so a distro package upgrade cannot
; quietly revert them and `dpkg` never prompts about a modified conffile.
; =============================================================================

; Uploads. Both processors cap at 10 MiB (MAX_UPLOAD_BYTES); PHP is set above
; that so the app returns its own validation message instead of PHP truncating
; the POST and handing the controller an empty $_FILES — which surfaces as a
; confusing "no file was uploaded" rather than "your file is too large".
upload_max_filesize = 12M
post_max_size = 12M
max_file_uploads = 12

; ListingImageProcessor::MAX_PIXELS is 40_000_000. A 40 MP image is decoded to a
; raw GD canvas in memory before it is resized, which is far more than the file
; size suggests. 256M is headroom for one of those plus the framework.
memory_limit = 256M

; Geocoding calls Nominatim with an 8s timeout and up to 3 attempts, and the
; PayFast validate round-trip is synchronous. 30s is the request ceiling; the
; libraries impose their own tighter ones.
max_execution_time = 30
max_input_time = 30

; Do not advertise the exact build to scanners. public/.htaccess also unsets the
; header, but that only covers responses Apache emits — this is the real fix.
expose_php = Off

date.timezone = Africa/Johannesburg

; Sessions are CodeIgniter's FileHandler under writable/session, not PHP's own
; save_path. These only matter for the marketing site's contact.php, which uses
; no session at all — set conservatively regardless.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1

; 0 means "stat every file on every request" — safe, and the reason the deploy
; workflow can get away with a reload rather than a restart. Raising this trades
; a little I/O for the risk of serving stale code after an rsync; if you do raise
; it, the `systemctl reload php8.3-fpm` in the deploy job stops being optional.
opcache.revalidate_freq = 0
