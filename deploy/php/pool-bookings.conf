; Online bookings get their own PHP-FPM workers, so a burst of availability,
; calendar or API requests can never take the five workers that serve profile
; and directory pages (and the other way round). Both vhosts send the booking
; paths here; see the <If> in deploy/apache/local.webscheduler.*.conf.
;
; Install: /etc/php/8.3/fpm/pool.d/bookings.conf, then
;   sudo php-fpm8.3 -t && sudo systemctl reload php8.3-fpm
;
; ondemand: no workers while nobody is booking (~45 MB each when they run).
[bookings]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-bookings.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 60s
pm.max_requests = 500
