# ==============================================================================
# WebScheduler Local abroad: https://local.webscheduler.app  (CodeIgniter 4)
#
# The SAME install as local.webscheduler.co.za: same DocumentRoot, same app,
# same .env, same database. The request's Host decides which site it is
# (Config\Sites, App\Services\SiteContext): co.za shows South African
# profiles, .app every other country. Everything below matches the co.za vhost
# except the names, the certificate and the log files.
#
# A separate vhost rather than a ServerAlias on the co.za one, because the
# certificate is per Cloudflare zone.
#
# Install (Phase 3 launch, with sites.app.enabled still false):
#   1. Cloudflare: create an Origin certificate for *.webscheduler.app and
#      webscheduler.app; save it as /etc/ssl/cloudflare/webscheduler.app.{pem,key}
#      (640 root:ssl-cert, like the co.za pair).
#   2. /etc/apache2/sites-available/local.webscheduler.app.conf, then
#      a2ensite local.webscheduler.app && apachectl configtest && systemctl reload apache2
#   3. Origin check: curl -k -H 'Host: local.webscheduler.app' https://127.0.0.1/health
#   4. Cloudflare DNS: change `local` from AAAA 100:: to the Lightsail A record,
#      proxied, and delete the temporary 302 rule for local.webscheduler.app.
#      The app's own SiteResolver still 302s to co.za until sites.app.enabled.
#
# PayFast never comes here: every PayFast URL is pinned to co.za
# (site_url_for(Sites::ZA, ...)), and /admin* answers 404 on this host.
# ==============================================================================

<VirtualHost *:80>
	ServerName local.webscheduler.app
	RedirectMatch permanent ^/(.*)$ https://local.webscheduler.app/$1
</VirtualHost>

<VirtualHost *:443>
	ServerName local.webscheduler.app

	DocumentRoot /var/www/listing/public_html

	SSLEngine on
	# A Cloudflare Origin certificate for *.webscheduler.app (the co.za one does
	# not cover this zone; Full (strict) would answer 526).
	SSLCertificateFile    /etc/ssl/cloudflare/webscheduler.app.pem
	SSLCertificateKeyFile /etc/ssl/cloudflare/webscheduler.app.key

	# --------------------------------------------------------------------------
	# ⚠️  AllowOverride All is LOAD-BEARING. Do not "tidy" it to None.
	#
	# Ubuntu's stock apache2.conf sets AllowOverride None for /var/www/. With
	# that, public/.htaccess is read and silently ignored, and the failure looks
	# nothing like a config error:
	#
	#     /                      200  (index.html-ish front page renders fine)
	#     /directory             404  ← Apache's plain "Not Found", not the
	#                                   site's branded 404: rewriting is off
	#
	# (/index.php/directory used to be the tell. The app 404s that form on
	# purpose now, see App\Filters\FrontControllerPath.)
	#
	# .htaccess carries the front-controller rewrite, the trailing-slash 301, the
	# www->apex HTTPS redirect, the X-Powered-By unset, and the CSP sandbox for
	# legacy SVG logos that Apache serves directly (App\Filters\SecureHeaders
	# cannot reach static files). All of it depends on this one word.
	# --------------------------------------------------------------------------
	<Directory /var/www/listing/public_html>
		AllowOverride All
		Require all granted
		Options -Indexes +FollowSymLinks
	</Directory>

	<FilesMatch \.php$>
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	# Defence in depth. directory-app/ is outside the DocumentRoot and therefore
	# already unreachable; this only matters if someone later repoints the
	# DocumentRoot or drops a symlink into public_html/. It costs nothing and it
	# covers .env, which is the file that would hurt.
	<Directory /var/www/listing/directory-app>
		Require all denied
	</Directory>

	# Uploaded logos and gallery photos. Served straight by Apache, so nothing in
	# CodeIgniter touches them — the SVG sandbox headers in .htaccess are the only
	# thing standing between a legacy stored SVG and same-origin script execution.
	# Never allow PHP execution here: these are user-supplied files.
	<Directory /var/www/listing/public_html/assets/listings>
		# Note: php_admin_flag/php_flag are mod_php directives and do NOT exist
		# under PHP-FPM — Apache refuses to start with "Invalid command". Undoing
		# the vhost-level SetHandler is the FPM-correct way to disarm .php here.
		<FilesMatch \.php$>
			SetHandler None
			Require all denied
		</FilesMatch>
	</Directory>

	<IfModule mod_headers.c>
		Header always unset X-Powered-By
	</IfModule>

	# Uploads cap at 10 MiB in ListingImageProcessor / VerificationDocumentProcessor
	# and PHP is configured to 12M; give the request body room above both so the
	# app returns its own validation error instead of Apache returning a bare 413.
	LimitRequestBody 13631488

	ErrorLog ${APACHE_LOG_DIR}/listing-app-error.log

	# /health is polled by the uptime monitor every minute. Keeping it out of the
	# access log stops it from being 90% of the file. It must stay reachable by
	# GET (not HEAD) and unthrottled — see App\Controllers\Health.
	# Exactly one CustomLog for this file: a second unconditional one would
	# double every other request.
	SetEnvIf Request_URI "^/health$" dontlog
	CustomLog ${APACHE_LOG_DIR}/listing-app-access.log cloudflare env=!dontlog
</VirtualHost>
