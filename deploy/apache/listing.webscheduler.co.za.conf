# ==============================================================================
# Listing service — https://listing.webscheduler.co.za  (CodeIgniter 4)
#
# The app lives ABOVE the web root; only public_html/ is served. docroot/index.php
# resolves the app with "../directory-app/app/Config/Paths.php" — scripts/
# build-listing-app.js rewrites that line and asserts it took.
#
#   /var/www/listing/
#   ├── directory-app/     app/ vendor/ writable/ .env spark   (NOT web-reachable)
#   └── public_html/       index.php .htaccess assets/         (this DocumentRoot)
#
# Install:  /etc/apache2/sites-available/listing.webscheduler.co.za.conf
#           a2ensite listing.webscheduler.co.za && systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
	ServerName listing.webscheduler.co.za
	RedirectMatch permanent ^/(.*)$ https://listing.webscheduler.co.za/$1
</VirtualHost>

<VirtualHost *:443>
	ServerName listing.webscheduler.co.za

	DocumentRoot /var/www/listing/public_html

	SSLEngine on
	SSLCertificateFile    /etc/ssl/cloudflare/webscheduler.co.za.pem
	SSLCertificateKeyFile /etc/ssl/cloudflare/webscheduler.co.za.key

	# --------------------------------------------------------------------------
	# ⚠️  AllowOverride All is LOAD-BEARING. Do not "tidy" it to None.
	#
	# Ubuntu's stock apache2.conf sets AllowOverride None for /var/www/. With
	# that, public/.htaccess is read and silently ignored, and the failure looks
	# nothing like a config error:
	#
	#     /                      200  (index.html-ish front page renders fine)
	#     /directory             404
	#     /index.php/directory   200  ← the tell: the app is fine, rewriting is off
	#
	# .htaccess carries the front-controller rewrite, the trailing-slash 301, the
	# www->apex HTTPS redirect, the X-Powered-By unset, and the CSP sandbox for
	# legacy SVG logos that Apache serves directly (App\Filters\SecureHeaders
	# cannot reach static files). All of it depends on this one word.
	# --------------------------------------------------------------------------
	<Directory /var/www/listing/public_html>
		AllowOverride All
		Require all granted
		Options -Indexes +FollowSymLinks
	</Directory>

	<FilesMatch \.php$>
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	# Defence in depth. directory-app/ is outside the DocumentRoot and therefore
	# already unreachable; this only matters if someone later repoints the
	# DocumentRoot or drops a symlink into public_html/. It costs nothing and it
	# covers .env, which is the file that would hurt.
	<Directory /var/www/listing/directory-app>
		Require all denied
	</Directory>

	# Uploaded logos and gallery photos. Served straight by Apache, so nothing in
	# CodeIgniter touches them — the SVG sandbox headers in .htaccess are the only
	# thing standing between a legacy stored SVG and same-origin script execution.
	# Never allow PHP execution here: these are user-supplied files.
	<Directory /var/www/listing/public_html/assets/listings>
		# Note: php_admin_flag/php_flag are mod_php directives and do NOT exist
		# under PHP-FPM — Apache refuses to start with "Invalid command". Undoing
		# the vhost-level SetHandler is the FPM-correct way to disarm .php here.
		<FilesMatch \.php$>
			SetHandler None
			Require all denied
		</FilesMatch>
	</Directory>

	<IfModule mod_headers.c>
		Header always unset X-Powered-By
	</IfModule>

	# Uploads cap at 10 MiB in ListingImageProcessor / VerificationDocumentProcessor
	# and PHP is configured to 12M; give the request body room above both so the
	# app returns its own validation error instead of Apache returning a bare 413.
	LimitRequestBody 13631488

	ErrorLog ${APACHE_LOG_DIR}/listing-error.log

	# /health is polled by the uptime monitor every minute. Keeping it out of the
	# access log stops it from being 90% of the file. It must stay reachable by
	# GET (not HEAD) and unthrottled — see App\Controllers\Health.
	# Exactly one CustomLog for this file: a second unconditional one would
	# double every other request.
	SetEnvIf Request_URI "^/health$" dontlog
	CustomLog ${APACHE_LOG_DIR}/listing-access.log cloudflare env=!dontlog
</VirtualHost>
