# ==============================================================================
# Legacy hostname — https://listing.webscheduler.co.za → https://local.webscheduler.co.za
#
# WebScheduler Local moved to local.webscheduler.co.za. This vhost keeps the old
# hostname working FOREVER. Do not disable it and do not delete its DNS record:
#
#   1. Search engines, emailed manage/verify links, the old playbook PDF and
#      WhatsApp posts all point here. Every GET gets ONE 301 to the same path and
#      query on local., with any trailing slash stripped in the same hop (the
#      .htaccess slash rule would otherwise make it two).
#
#   2. PayFast. A subscription's notify_url is fixed when it is created, so every
#      Verified subscription that started before the move keeps POSTing its
#      monthly ITN to https://listing.webscheduler.co.za/payfast/notify. A 301 on
#      a server-to-server POST is not followed reliably, so that one path is
#      SERVED here by the app, not redirected. PayFastNotify checks the signature,
#      the source IP and PayFast's own validation; none of that depends on the
#      host. Remove the exception only when no pre-move subscription is active.
#
# Rollback (serve the whole app here again): copy
# listing.webscheduler.co.za.conf.serve over this file and restore app.baseURL.
# Install:  /etc/apache2/sites-available/listing.webscheduler.co.za.conf
#           apachectl configtest && systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
	ServerName listing.webscheduler.co.za
	RewriteEngine On
	RewriteRule ^/(.*?)/*$ https://local.webscheduler.co.za/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerName listing.webscheduler.co.za

	DocumentRoot /var/www/listing/public_html

	SSLEngine on
	SSLCertificateFile    /etc/ssl/cloudflare/webscheduler.co.za.pem
	SSLCertificateKeyFile /etc/ssl/cloudflare/webscheduler.co.za.key

	# Server-context rewrites run before .htaccess, so this is the only hop.
	# The query string is carried over untouched, and the path is re-escaped.
	#
	# The exception tests THE_REQUEST (the client's original request line), NOT
	# REQUEST_URI. .htaccess internally rewrites /payfast/notify to
	# /index.php/payfast/notify, and this vhost's rules run again on that
	# internal redirect: a REQUEST_URI test no longer matches there, and the ITN
	# gets a 301 after all. Caught in a local Apache test, 3 Oct 2026.
	RewriteEngine On
	RewriteCond %{THE_REQUEST} !^POST\ /payfast/notify(\?|\ )
	RewriteRule ^/(.*?)/*$ https://local.webscheduler.co.za/$1 [R=301,L]

	# Only /payfast/notify gets this far. It needs the same front-controller
	# setup as the canonical vhost: .htaccess (AllowOverride All) routes it to
	# index.php, and FPM runs it.
	<Directory /var/www/listing/public_html>
		AllowOverride All
		Require all granted
		Options -Indexes +FollowSymLinks
	</Directory>

	<FilesMatch \.php$>
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	<Directory /var/www/listing/directory-app>
		Require all denied
	</Directory>

	<IfModule mod_headers.c>
		Header always unset X-Powered-By
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/listing-legacy-error.log
	CustomLog ${APACHE_LOG_DIR}/listing-legacy-access.log cloudflare
</VirtualHost>
