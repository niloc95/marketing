# =============================================================================
# The "cloudflare" LogFormat, referenced by both vhosts' CustomLog lines.
#
# Install:  /etc/apache2/conf-available/webscheduler-logformat.conf
#           a2enconf webscheduler-logformat && systemctl reload apache2
#
# Without this, `apache2ctl configtest` fails on both vhosts with
# "Unrecognized LogFormat directive" — enable it BEFORE the sites.
# =============================================================================

# Both hostnames sit behind Cloudflare, so %h is always a Cloudflare edge IP and
# useless for spotting an abusive client. CF-Connecting-IP carries the real one.
#
# ⚠️ Read this before reaching for mod_remoteip instead:
#
# mod_remoteip would REPLACE REMOTE_ADDR with the client IP. App\Config\App::
# $proxyIPs works the other way round — it trusts CF-Connecting-IP only after
# confirming REMOTE_ADDR is inside Cloudflare's ranges. Rewriting REMOTE_ADDR
# makes that check stop matching, so CI4 silently falls back to REMOTE_ADDR and
# the carefully-configured proxyIPs list becomes dead code.
#
# It happens to still yield the correct IP today, which is exactly what makes it
# dangerous: the throttles keep working, so nothing tells you the trust path
# changed. Logging the header — as below — gets real IPs in the log while
# leaving REMOTE_ADDR, and therefore the app's throttling, untouched.
#
# If you ever terminate TLS directly and drop Cloudflare, empty $proxyIPs and
# switch this back to %h.
LogFormat "%{CF-Connecting-IP}i %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" cf=%{CF-Ray}i edge=%h" cloudflare
