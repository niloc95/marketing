# ==============================================================================
# Marketing site — https://webscheduler.co.za
#
# Pure static file serving. The pages use explicit .html URLs and relative links
# ("./features.html"), so there is NO rewriting to do and no .htaccess in this
# docroot — unlike the listing app next door, which depends on one entirely.
#
# Install:  /etc/apache2/sites-available/webscheduler.co.za.conf
#           a2ensite webscheduler.co.za && systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
	ServerName  webscheduler.co.za
	ServerAlias www.webscheduler.co.za

	# Cloudflare is set to Full (strict) and talks to us on 443, so :80 should
	# only ever see direct-to-origin traffic. Redirect rather than serve it.
	RedirectMatch permanent ^/(.*)$ https://webscheduler.co.za/$1
</VirtualHost>

<VirtualHost *:443>
	ServerName  webscheduler.co.za
	ServerAlias www.webscheduler.co.za

	DocumentRoot /var/www/marketing

	SSLEngine on
	SSLCertificateFile    /etc/ssl/cloudflare/webscheduler.co.za.pem
	SSLCertificateKeyFile /etc/ssl/cloudflare/webscheduler.co.za.key

	# www -> apex. The listing app does this in .htaccess; the marketing docroot
	# has no .htaccess, so it has to live here. Always to https:// — a redirect
	# to http:// would bounce back off the :80 vhost above and cost a round trip.
	RewriteEngine On
	RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
	RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]

	# Old WordPress feed URLs Googlebot still asks for (found 17 Oct 2026). This
	# site never had a feed, so they are gone for good: 410, not 404.
	RewriteRule ^/(comments/)?feed/?$ - [G,L]

	# Clean URLs. Since 1 Nov 2026 the site is built from niloc95/webscheduler-site,
	# which links /pricing, not /pricing.html, as Cloudflare Pages serves them. Until
	# the move to Pages this vhost does the same: the old features page moved to
	# /bookings, a typed /x.html 301s to /x (THE_REQUEST, so the internal rewrite
	# below cannot loop), and /x serves x.html when that file exists.
	RewriteRule ^/features(\.html)?$ https://webscheduler.co.za/bookings [R=301,L]
	RewriteCond %{THE_REQUEST} "^[A-Z]+ /index\.html[ ?]"
	RewriteRule ^ https://webscheduler.co.za/ [R=301,L]
	RewriteCond %{THE_REQUEST} "^GET /([a-z0-9-]+)\.html[ ?]"
	RewriteRule ^ https://webscheduler.co.za/%1 [R=301,L]
	# A trailing slash (/pricing/, typed or added by a mail client) 404d until
	# 13 Nov 2026: 301 it to the clean URL when that page exists. /developer/ is
	# a real directory with no developer.html, so it is untouched.
	RewriteCond %{DOCUMENT_ROOT}/$1.html -f
	RewriteRule ^/([a-z0-9-]+)/$ https://webscheduler.co.za/$1 [R=301,L]
	RewriteCond %{DOCUMENT_ROOT}/$1.html -f
	RewriteRule ^/([a-z0-9-]+)$ /$1.html [L]

	<Directory /var/www/marketing>
		# AllowOverride None is correct HERE and only here: this docroot ships no
		# .htaccess, so leaving overrides off saves Apache a stat() per directory
		# per request. Do NOT copy this into the listing vhost.
		AllowOverride None
		Require all granted
		Options -Indexes +FollowSymLinks
		DirectoryIndex index.html
	</Directory>

	# contact.php — the demo-request endpoint, the one dynamic file on this site.
	# It reads SMTP credentials from /home/deploy/.ws-contact.env, which lives
	# ABOVE the docroot and is placed by hand (chmod 600), never by a deploy.
	<FilesMatch \.php$>
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	# The vendored PHPMailer classes under lib/ ship with their own deny-all
	# .htaccess, which AllowOverride None above would ignore. Re-state it here so
	# the protection does not depend on a setting this vhost turns off.
	<Directory /var/www/marketing/lib>
		Require all denied
	</Directory>

	# Deployed from a DIFFERENT repo (niloc95/xscheduler_ci4, `npm run docs:build`)
	# into this same docroot. Nothing in dist/site/ produces it, which is why the
	# deploy workflow must exclude it from --delete. Declared here only so the
	# coupling is visible to whoever reads this file next.
	<Directory /var/www/marketing/developer>
		Require all granted
		Options -Indexes +FollowSymLinks
		DirectoryIndex index.html
	</Directory>

	# Asset filenames are NOT content-hashed (see the Cloudflare purge step in
	# the deploy workflow), so a long browser max-age here would strand visitors
	# on stale CSS that no origin purge can reach. Keep it short; let Cloudflare
	# do the caching, since that we can purge.
	<IfModule mod_expires.c>
		ExpiresActive On
		ExpiresByType text/css           "access plus 1 hour"
		ExpiresByType application/javascript "access plus 1 hour"
		ExpiresByType image/png          "access plus 7 days"
		ExpiresByType image/jpeg         "access plus 7 days"
		ExpiresByType image/svg+xml      "access plus 7 days"
		ExpiresByType image/webp         "access plus 7 days"
		ExpiresByType font/woff2         "access plus 30 days"
	</IfModule>

	<IfModule mod_headers.c>
		Header always unset X-Powered-By
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "DENY"
		Header always set Referrer-Policy "no-referrer"

		# HSTS is deliberately NOT set here. The listing app sends it for its own
		# host (App\Filters\SecureHeaders), but this site has never sent it from
		# Hostinger, and turning it on at the APEX with includeSubDomains commits
		# every present and future subdomain for two years with no quick undo.
		# That is a security decision to take on purpose, not a side effect of
		# changing hosts. To adopt it, uncomment — apex first, subdomains later:
		# Header always set Strict-Transport-Security "max-age=63072000"
	</IfModule>

	ErrorLog  ${APACHE_LOG_DIR}/marketing-error.log
	CustomLog ${APACHE_LOG_DIR}/marketing-access.log cloudflare
</VirtualHost>
