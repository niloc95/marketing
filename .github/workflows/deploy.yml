name: Deploy to production (cPanel)

# Auto-deploys on push to main. Two independent jobs:
#   marketing  -> composer installs (for PHPMailer), builds dist/site and
#                 uploads it to the main domain docroot
#   directory  -> composer installs and uploads the CI4 app to the subdomain root
#
# Both jobs run composer. The marketing site is static apart from contact.php,
# the demo-request endpoint, whose only dependency is PHPMailer — the build
# copies three of its files into dist/site/lib/. PHPMailer therefore also lands
# unused in the directory app's vendor/; that is harmless, and removing it from
# composer.json would break the marketing contact form.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   FTP_MARKETING_DIR  (e.g. /public_html/)
#   FTP_DIRECTORY_DIR  (e.g. /directory_app/  — subdomain docroot points at <this>/public)
#   SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, SSH_PORT (optional, default 22)
#   SSH_DIRECTORY_APP_PATH  (absolute server filesystem path to the app root, e.g.
#                            /home/<cpuser>/directory_app — same folder as FTP_DIRECTORY_DIR
#                            points at, but as seen by SSH rather than FTP)
#
# Every deploy runs `php spark migrate` over SSH after the FTP upload (see the
# `migrate` job below) — schema changes ship automatically, not just on first deploy.
# First-time-only steps (seeding, .env, subdomain/DB creation) are still manual —
# see DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marketing:
    name: Marketing site → main domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must run BEFORE the site build: it reads vendor/phpmailer/ to vendor the
      # three classes contact.php requires, and fails the build if they are
      # absent rather than shipping an endpoint that 500s on every submission.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer

      - name: Install PHP deps (PHPMailer, for contact.php)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          npm run site:build

      - name: Deploy dist/site via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/site/
          server-dir: ${{ secrets.FTP_MARKETING_DIR }}

  directory:
    name: Directory app → subdomain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match production (PHP 8.3 on the cPanel host). composer.json requires
      # ^8.2 via CodeIgniter 4.7, so the old '8.1' pin failed the install
      # outright — the vendor tree must also be resolved against the runtime it
      # will actually execute on, not merely a version that satisfies the range.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          tools: composer

      - name: Install PHP deps (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Deploy CI4 app via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIRECTORY_DIR }}
          # Never ship the server .env, dev/build tooling, or the marketing site.
          # public/assets/listings holds uploaded logos and gallery photos, and
          # writable/verification holds verification documents — both belong to
          # whichever environment created them. .gitignore keeps them out of the
          # repo; without the excludes below they would still be FTP'd over
          # production's own files. (Keep comments out of the block scalar
          # itself — there, a leading # is a literal glob, not a comment.)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/marketing-site/**
            **/scripts/**
            **/public/assets/listings/**
            **/writable/verification/**
            **/dist/**
            **/tests/**
            **/.env
            **/DEPLOY.md
            **/README.md
            **/package.json
            **/package-lock.json
            **/phpunit.xml.dist
            **/phpunit.dist.xml

  migrate:
    name: Directory app → run migrations
    needs: directory
    runs-on: ubuntu-latest
    steps:
      - name: php spark migrate over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SSH_DIRECTORY_APP_PATH }}
            php spark migrate --all
