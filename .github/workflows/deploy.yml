name: Deploy to production (Lightsail)

# ⚠️  DORMANT — this workflow no longer fires on push. Releases are manual.
#
# The production instance is provisioned and released by hand from the Lightsail
# browser terminal: `git pull` on the server, build there, `cp -a` into /var/www.
# See deploy/LAMP-SETUP.md ("Releasing changes after this") and the
# deploy-production skill. The SSH_* secrets this workflow needs do not exist,
# and the `deploy` user has no authorized_keys entry, so a push-triggered run
# would fail on every push to main for no useful reason.
#
# It is retained rather than deleted because the rsync exclusions below encode
# which server paths hold data that exists in exactly one place — the kind of
# knowledge that is expensive to reconstruct. To revive it: restore the `push:`
# trigger, add the four SSH secrets, and put the CI public key in
# /home/deploy/.ssh/authorized_keys.
#
# Below describes what it does WHEN RUN MANUALLY, and what it would do if
# re-enabled:
#
#   marketing  -> rsync dist/site/     to /var/www/marketing        (webscheduler.co.za)
#   directory  -> rsync dist/listing/  to /var/www/listing/{directory-app,public_html}
#                 then `php spark migrate --all` and reload PHP-FPM
#
# Both jobs run composer. The marketing site is static apart from contact.php,
# the demo-request endpoint, whose only dependency is PHPMailer — the build
# copies three of its files into dist/site/lib/. PHPMailer therefore also lands
# unused in the directory app's vendor/; that is harmless, and removing it from
# composer.json would break the marketing contact form.
#
# This replaces the FTPS pipeline that shipped to Hostinger shared hosting.
# Two things that were impossible there are now the point of the whole exercise:
# the directory app deploys automatically (its FTPS job never once completed a
# run — FTP credentials were shared between both apps, so it had to be gutted
# rather than guarded), and migrations run without anyone typing them into a
# web terminal.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST          the Lightsail static IP
#   SSH_USER          deploy
#   SSH_PRIVATE_KEY   private half of the key in /home/deploy/.ssh/authorized_keys
#   SSH_KNOWN_HOSTS   output of: ssh-keyscan -H <static-ip>
#                     Pinned rather than trust-on-first-use: without it every run
#                     would accept whatever host key it is handed, which is the
#                     whole attack this protects against.
#
# OPTIONAL:
#   CF_ZONE_ID, CF_API_TOKEN   Cloudflare cache purge after the marketing upload.
#                              Token needs Zone -> Cache Purge -> Purge. Unset
#                              means visitors keep seeing the previous build.
#
# The FTP_* secrets are no longer read by anything. Delete them from the repo
# once Hostinger is decommissioned.

# Manual dispatch only. There is deliberately no `push:` trigger — see the
# DORMANT note above.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what rsync would change, transfer nothing'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  RSYNC_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run --itemize-changes' || '' }}

jobs:
  # ============================================================================
  marketing:
    name: Marketing site → webscheduler.co.za
    runs-on: ubuntu-latest
    env:
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      # Mapped into env because the `secrets` context is not available to any
      # `if:` — see the note on the Cloudflare purge step below.
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Must run BEFORE the site build: it reads vendor/phpmailer/ to vendor the
      # three classes contact.php requires, and fails the build if they are
      # absent rather than shipping an endpoint that 500s on every submission.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer

      - name: Install PHP deps (PHPMailer, for contact.php)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          npm run site:build

      # rsync --delete is unforgiving in a way FTP-Deploy-Action was not: it
      # mirrors, full stop. If the build ever emits an empty or near-empty
      # dist/site, --delete would faithfully empty the live docroot. The build
      # script's own guards would normally catch that first; this is the backstop
      # for the case where it exits 0 having produced nothing useful.
      - name: Sanity-check the bundle before letting --delete near it
        run: |
          set -euo pipefail
          test -f dist/site/index.html || { echo "::error::dist/site/index.html missing — refusing to deploy."; exit 1; }
          count=$(find dist/site -type f | wc -l)
          echo "dist/site contains $count files"
          [ "$count" -ge 10 ] || { echo "::error::Only $count files in dist/site — refusing to deploy."; exit 1; }

      # This workflow can land on main before the Lightsail instance exists. Skip
      # loudly rather than reddening every push with an SSH failure that says
      # nothing about the code — the same reasoning that guarded the old
      # migrate job. Once SSH_HOST is set, these guards never fire again.
      - name: Not deployed — Lightsail is not configured yet
        if: env.SSH_HOST == ''
        run: |
          echo "::warning::SSH_HOST is not set, so nothing was deployed."
          echo "::warning::The build ran and its guards passed. Set SSH_HOST, SSH_USER,"
          echo "::warning::SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS once the instance is up."
          {
            echo "### ℹ️ Nothing deployed"
            echo ""
            echo "\`SSH_HOST\` is unset — the Lightsail instance is not wired up yet."
            echo "The site **was built** and passed every guard; it just was not shipped."
            echo ""
            echo "See \`deploy/README.md\` for provisioning and the secret list."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        if: env.SSH_HOST != ''
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ⚠️ --exclude='/developer/' is NOT optional.
      #
      # The developer API portal is built and deployed from a DIFFERENT repo
      # (niloc95/xscheduler_ci4, `npm run docs:build`) into this same docroot,
      # and nothing in dist/site/ reproduces it. It survived the FTPS era only
      # because FTP-Deploy-Action tracked its own uploads in a server-side state
      # file and never touched files it had not put there. rsync has no such
      # memory: without this exclude, the first deploy silently deletes
      # /developer/ and the marketing pages start linking to a 404.
      - name: Deploy dist/site via rsync
        if: env.SSH_HOST != ''
        run: |
          set -euo pipefail
          rsync -az --delete ${RSYNC_DRY_RUN} \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude='/developer/' \
            dist/site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/marketing/"

      # Cloudflare proxies the apex (orange cloud). Without this, an upload that
      # succeeded still leaves visitors on the previous HTML and CSS — the deploy
      # looks green, the site looks unchanged, and the time goes into debugging a
      # bug that isn't there. Purge everything rather than by URL: the asset
      # filenames are not content-hashed, so a URL list would have to be kept in
      # sync with the build by hand.
      #
      # The secret is read through `env`, not `secrets`, in the `if:`. The
      # `secrets` context is NOT available to any `if` condition — job or step —
      # so `if: secrets.CF_ZONE_ID != ''` would not gate anything. Mapping it
      # into `env` first is the documented way to make a secret's presence
      # testable.
      - name: Purge Cloudflare cache
        if: env.SSH_HOST != '' && env.CF_ZONE_ID != '' && github.event.inputs.dry_run != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          # curl exits 0 on a 4xx from the API, so the body is the only signal.
          echo "$response" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge failed — visitors may keep seeing the previous build."; exit 1; }

      - name: Remind to purge Cloudflare by hand
        if: env.SSH_HOST != '' && env.CF_ZONE_ID == ''
        run: |
          echo "::warning::CF_ZONE_ID is not set, so the Cloudflare cache was NOT purged."
          echo "::warning::Visitors may keep seeing the previous build. Purge manually:"
          echo "::warning::  Cloudflare → Caching → Configuration → Purge Everything"

  # ============================================================================
  directory:
    name: Directory app → listing.webscheduler.co.za
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Mirrors what the instance has. The bundle only needs composer to
          # resolve, but matching the runtime here means a platform mismatch
          # surfaces in CI rather than as a 500 after deploy.
          extensions: mbstring, intl, mysqli, curl, gd, exif
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Produces dist/listing/{directory-app,docroot}/ and runs its own guards:
      # no .env in the bundle, no dev dependencies, CSRF filter enabled, no
      # http:// downgrade in .htaccess, migrations and seeder present, and
      # index.php repointed at ../directory-app.
      - name: Build deploy bundle
        run: |
          npm ci
          npm run list:build

      - name: Sanity-check the bundle before letting --delete near it
        run: |
          set -euo pipefail
          test -f dist/listing/docroot/index.php        || { echo "::error::docroot/index.php missing."; exit 1; }
          test -f dist/listing/docroot/.htaccess        || { echo "::error::docroot/.htaccess missing — every URL but / would 404."; exit 1; }
          test -d dist/listing/directory-app/vendor     || { echo "::error::vendor/ missing."; exit 1; }
          test -f dist/listing/directory-app/spark      || { echo "::error::spark missing — migrations could not run."; exit 1; }

      - name: Not deployed — Lightsail is not configured yet
        if: env.SSH_HOST == ''
        run: |
          echo "::warning::SSH_HOST is not set, so the directory app was NOT deployed."
          echo "::warning::The bundle built and passed every guard. See deploy/README.md."
          {
            echo "### ℹ️ Directory app not deployed"
            echo ""
            echo "\`SSH_HOST\` is unset — the Lightsail instance is not wired up yet."
            echo "The bundle **was built** and passed its guards; migrations did not run"
            echo "because nothing new shipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        if: env.SSH_HOST != ''
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Every --exclude below maps to a way --delete would destroy production
      # data that exists in exactly one place and is in no git repo. This list
      # is the FTPS-era exclude list, which survived only as prose in DEPLOY.md
      # after the old job was gutted.
      #
      #   .env                     the server's secrets; the bundle never carries one
      #   writable/verification/   uploaded identity documents
      #   writable/{logs,cache,session}/  runtime state; deleting cache also
      #                            takes every rate limit with it
      - name: Deploy app tree (above the web root)
        if: env.SSH_HOST != ''
        run: |
          set -euo pipefail
          rsync -az --delete ${RSYNC_DRY_RUN} \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude='.env' \
            --exclude='writable/verification/' \
            --exclude='writable/logs/' \
            --exclude='writable/cache/' \
            --exclude='writable/session/' \
            dist/listing/directory-app/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/listing/directory-app/"

      # assets/listings/ holds uploaded logos and gallery photos. The build ships
      # the directory empty on purpose (build-listing-app.js removes it, so a
      # developer's local test images never ride along) — which is exactly why
      # --delete must not be allowed to mirror that emptiness onto the server.
      - name: Deploy web root
        if: env.SSH_HOST != ''
        run: |
          set -euo pipefail
          rsync -az --delete ${RSYNC_DRY_RUN} \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude='assets/listings/' \
            dist/listing/docroot/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/listing/public_html/"

      # Migrations run in THIS job rather than a dependent one. A separate job
      # would add a runner cold-start to the window in which new code is live
      # against the old schema — which surfaces as a 500 on whichever page
      # touches the new column, not as an obvious outage. Same reason the FPM
      # reload comes after: it is what makes the new code actually take effect.
      #
      # Forward-only, as on the old host: `migrate:rollback` against production
      # stays banned. Code rolls back by redeploying; schema is fixed forward
      # with a new migration.
      - name: Run migrations and reload PHP-FPM
        if: env.SSH_HOST != '' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /var/www/listing/directory-app
            php spark migrate --all
            # opcache.revalidate_freq is 0, so PHP already re-stats changed files
            # and this is belt-and-braces. It stops being optional the moment
            # anyone raises that value for performance.
            sudo systemctl reload php8.3-fpm
          REMOTE

      # A deploy that shipped but did not come back up should not be discovered
      # by a user. /health returns 200/503 to anyone; the per-check detail needs
      # the token, which CI does not have and does not need.
      #
      # Checked against the ORIGIN over the SSH connection, not against the
      # public URL. Curling https://listing.webscheduler.co.za/ from the runner
      # would test whatever DNS currently resolves to — which, until the cutover
      # completes, is still Hostinger. That would report a green deploy while
      # confirming nothing about the box we just shipped to. -k because the
      # Cloudflare origin certificate is not in any public trust store.
      - name: Verify the origin is serving
        if: env.SSH_HOST != '' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "curl -sk -o /dev/null -w '%{http_code}' -H 'Host: listing.webscheduler.co.za' https://127.0.0.1/health" || echo 000)
            [ "$code" = "200" ] && { echo "origin health OK"; exit 0; }
            echo "attempt $i: /health returned $code"
            sleep 5
          done
          echo "::error::/health did not return 200 on the origin after the deploy."
          echo "::error::Check: ssh in and read writable/logs/ — a 503 here means a"
          echo "::error::SystemHealth check failed (db, writable paths), not that Apache is down."
          exit 1
